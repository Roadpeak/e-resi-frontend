name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/e-resi-frontend

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.e-resi.com
            NEXT_PUBLIC_APP_URL=https://app.e-resi.com
            NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}
            NEXT_DEPLOYMENT_ID=${{ github.sha }}

  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      # Plain OpenSSH from the runner rather than appleboy/ssh-action: that
      # action downloads its binary from GitHub Releases on every run, so a
      # Releases outage (2026-11-08, 504s for over half an hour) blocked
      # deploys of builds that had already passed.
      - name: SSH pull + roll frontend
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Variables travel over the SSH session's stdin, never on a command line.
          {
            printf 'export GHCR_USER=%q GHCR_TOKEN=%q IMAGE_TAG=%q\n' "$GHCR_USER" "$GHCR_TOKEN" "$IMAGE_TAG"
            cat <<'REMOTE'
          set -euo pipefail
          cd /home/deploy/e-resi

          # Auth against sibling GHCR namespace (same Roadpeak org).
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # docker-compose.prod.yml marks the frontend service `pull_policy: never`
          # so backend deploys can't touch it. Bypass that policy with a
          # direct `docker pull`, then roll only the frontend container.
          export FRONTEND_IMAGE_TAG="$IMAGE_TAG"
          docker pull "ghcr.io/roadpeak/e-resi-frontend:$IMAGE_TAG"
          docker compose -f docker-compose.prod.yml up -d --no-deps frontend

          # Nudge nginx so it re-resolves the frontend upstream.
          docker compose -f docker-compose.prod.yml restart nginx

          docker image prune -f
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "$DROPLET_USER@$DROPLET_HOST" 'bash -s'
          rm -f ~/.ssh/deploy_key
